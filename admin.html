<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін - Галерея Пам'ятників</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    .admin-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .product-form { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #333; color: #fff; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .products-list { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .product-item:last-child { border-bottom: none; }
    .actions { display: flex; gap: 10px; }
    .empty-state { text-align: center; padding: 40px; color: #666; }
    .loading { text-align: center; padding: 40px; }
    .auth-section { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>🛠️ Адмін-панель</h1>
      <p class="subtitle">Редагування каталогу пам'ятників (Supabase)</p>
    </div>
  </header>

  <main class="admin-container">
    <!-- Auth Section (optional - for production use) -->
    <div class="auth-section" id="auth-section" style="display: none;">
      <p>Для редагування увійдіть через Supabase</p>
      <button class="btn btn-primary" onclick="signIn()">Увійти</button>
    </div>

    <!-- Add/Edit Form -->
    <div class="product-form">
      <h2 id="form-title">Додати новий пам'ятник</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" value="">
        
        <div class="form-group">
          <label for="name">Назва</label>
          <input type="text" id="name" required placeholder="Пам'ятник гранітний 'Ангел'">
        </div>
        
        <div class="form-group">
          <label for="category">Категорія</label>
          <select id="category" required>
            <option value="granite">Гранітні</option>
            <option value="marble">Мармурові</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="price">Ціна</label>
          <input type="text" id="price" required placeholder="15 000 грн">
        </div>
        
        <div class="form-group">
          <label for="emoji">Emoji</label>
          <input type="text" id="emoji" value="🪦" placeholder="🪦">
        </div>
        
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Додати</button>
          <button type="button" class="btn" id="cancel-btn" style="display: none; background: #6c757d; color: #fff;" onclick="cancelEdit()">Скасувати</button>
        </div>
      </form>
    </div>

    <!-- Products List -->
    <div class="products-list">
      <h2>Список товарів (<span id="count">0</span>)</h2>
      <div id="loading" class="loading">Завантаження...</div>
      <div id="products-list"></div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p>Товарів поки що немає. Додайте перший!</p>
      </div>
    </div>
  </main>

  <script>
    let editId = null;

    // Load products from Supabase
    async function loadProducts() {
      const list = document.getElementById('products-list');
      const loading = document.getElementById('loading');
      const emptyState = document.getElementById('empty-state');
      
      loading.style.display = 'block';
      list.innerHTML = '';
      
      try {
        const { data, error } = await window.sbClient
          .from('products')
          .select('*')
          .order('created_at', { ascending: false });
        
        loading.style.display = 'none';
        
        if (error) {
          console.error('Error:', error);
          alert('Помилка завантаження!');
          return;
        }
        
        products = data || [];
        document.getElementById('count').textContent = products.length;
        
        if (products.length === 0) {
          emptyState.style.display = 'block';
          return;
        }
        
        emptyState.style.display = 'none';
        renderList();
      } catch (err) {
        loading.style.display = 'none';
        console.error('Error:', err);
        alert('Помилка підключення до бази даних!');
      }
    }

    // Render products list
    function renderList() {
      const list = document.getElementById('products-list');
      list.innerHTML = products.map(p => `
        <div class="product-item">
          <div>
            <strong>${p.emoji || '🪦'} ${p.name}</strong><br>
            <small>${p.category === 'granite' ? 'Гранітні' : 'Мармурові'} • ${p.price}</small>
          </div>
          <div class="actions">
            <button class="btn" style="background: #ffc107;" onclick="editProduct(${p.id})">✏️</button>
            <button class="btn btn-danger" onclick="deleteProduct(${p.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // Add or update product
    document.getElementById('product-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const id = document.getElementById('product-id').value;
      const name = document.getElementById('name').value;
      const category = document.getElementById('category').value;
      const price = document.getElementById('price').value;
      const emoji = document.getElementById('emoji').value;
      
      try {
        if (editId) {
          // Update existing
          const { data, error } = await window.sbClient
            .from('products')
            .update({ name, category, price, emoji })
            .eq('id', editId);
          
          if (error) throw error;
          cancelEdit();
        } else {
          // Add new
          const { data, error } = await window.sbClient
            .from('products')
            .insert([{ name, category, price, emoji }]);
          
          if (error) throw error;
        }
        
        // Reload products
        await loadProducts();
        document.getElementById('product-form').reset();
        document.getElementById('emoji').value = '🪦';
      } catch (err) {
        console.error('Error:', err);
        alert('Помилка збереження!');
      }
    });

    // Edit product
    async function editProduct(id) {
      const product = products.find(p => p.id == id);
      if (!product) return;
      
      editId = id;
      document.getElementById('product-id').value = id;
      document.getElementById('name').value = product.name;
      document.getElementById('category').value = product.category;
      document.getElementById('price').value = product.price;
      document.getElementById('emoji').value = product.emoji || '🪦';
      
      document.getElementById('form-title').textContent = "Редагувати пам'ятник";
      document.getElementById('submit-btn').textContent = 'Оновити';
      document.getElementById('cancel-btn').style.display = 'inline-block';
    }

    // Cancel edit
    function cancelEdit() {
      editId = null;
      document.getElementById('product-form').reset();
      document.getElementById('emoji').value = '🪦';
      document.getElementById('form-title').textContent = "Додати новий пам'ятник";
      document.getElementById('submit-btn').textContent = 'Додати';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    // Delete product
    async function deleteProduct(id) {
      if (!confirm('Ви впевнені, що хочете видалити цей товар?')) return;
      
      try {
        const { data, error } = await window.sbClient
          .from('products')
          .delete()
          .eq('id', id);
        
        if (error) throw error;
        
        await loadProducts();
      } catch (err) {
        console.error('Error:', err);
        alert('Помилка видалення!');
      }
    }

    // Auth functions (optional)
    async function signIn() {
      const { data, error } = await window.sbClient.auth.signInWithOtp({
        email: prompt('Введіть ваш email:'),
      });
      if (error) alert('Помилка входу!');
      else alert('Перевірте email для підтвердження!');
    }

    // Load on start
    let products = [];
    loadProducts();
  </script>
</body>
</html>
