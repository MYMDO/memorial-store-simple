<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін - Галерея Пам'ятників</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
    .product-form { background: #fff; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
    .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    .btn-primary { background: #333; color: #fff; }
    .btn-danger { background: #dc3545; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .products-list { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .product-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .product-item:last-child { border-bottom: none; }
    .actions { display: flex; gap: 10px; }
    .empty-state { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <h1>🛠️ Адмін-панель</h1>
      <p class="subtitle">Редагування каталогу пам'ятників</p>
    </div>
  </header>

  <main class="admin-container">
    <!-- Add/Edit Form -->
    <div class="product-form">
      <h2 id="form-title">Додати новий пам'ятник</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" value="">
        
        <div class="form-group">
          <label for="name">Назва</label>
          <input type="text" id="name" required placeholder="Пам'ятник гранітний 'Ангел'">
        </div>
        
        <div class="form-group">
          <label for="category">Категорія</label>
          <select id="category" required>
            <option value="granite">Гранітні</option>
            <option value="marble">Мармурові</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="price">Ціна</label>
          <input type="text" id="price" required placeholder="15 000 грн">
        </div>
        
        <div class="form-group">
          <label for="emoji">Emoji</label>
          <input type="text" id="emoji" value="🪦" placeholder="🪦">
        </div>
        
        <div style="display: flex; gap: 10px;">
          <button type="submit" class="btn btn-primary" id="submit-btn">Додати</button>
          <button type="button" class="btn" id="cancel-btn" style="display: none; background: #6c757d; color: #fff;" onclick="cancelEdit()">Скасувати</button>
        </div>
      </form>
    </div>

    <!-- Products List -->
    <div class="products-list">
      <h2>Список товарів (<span id="count">0</span>)</h2>
      <div id="products-list"></div>
      <div id="empty-state" class="empty-state" style="display: none;">
        <p>Товарів поки що немає. Додайте перший!</p>
      </div>
    </div>

    <!-- Export/Import -->
    <div style="margin-top: 20px; text-align: center;">
      <button class="btn btn-success" onclick="exportJSON()">📥 Експортувати JSON</button>
      <button class="btn" style="background: #17a2b8; color: #fff; margin-left: 10px;" onclick="document.getElementById('import-file').click()">📤 Імпортувати JSON</button>
      <input type="file" id="import-file" style="display: none;" accept=".json" onchange="importJSON(event)">
    </div>
  </main>

  <script src="products.js"></script>
  <script>
    let editId = null;

    // Load products from localStorage or use default
    function loadProducts() {
      const saved = localStorage.getItem('products');
      if (saved) {
        products = JSON.parse(saved);
      }
      renderList();
    }

    // Save products to localStorage
    function saveProducts() {
      localStorage.setItem('products', JSON.stringify(products));
    }

    // Render products list
    function renderList() {
      const list = document.getElementById('products-list');
      const emptyState = document.getElementById('empty-state');
      const count = document.getElementById('count');
      
      count.textContent = products.length;
      
      if (products.length === 0) {
        list.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      list.innerHTML = products.map(p => `
        <div class="product-item">
          <div>
            <strong>${p.emoji} ${p.name}</strong><br>
            <small>${p.category === 'granite' ? 'Гранітні' : 'Мармурові'} • ${p.price}</small>
          </div>
          <div class="actions">
            <button class="btn" style="background: #ffc107;" onclick="editProduct(${p.id})">✏️</button>
            <button class="btn btn-danger" onclick="deleteProduct(${p.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // Add or update product
    document.getElementById('product-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const id = document.getElementById('product-id').value;
      const name = document.getElementById('name').value;
      const category = document.getElementById('category').value;
      const price = document.getElementById('price').value;
      const emoji = document.getElementById('emoji').value;
      
      if (editId) {
        // Update existing
        const index = products.findIndex(p => p.id == editId);
        if (index !== -1) {
          products[index] = { id: parseInt(editId), name, category, price, emoji };
        }
        cancelEdit();
      } else {
        // Add new
        const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
        products.push({ id: newId, name, category, price, emoji });
      }
      
      saveProducts();
      renderList();
      document.getElementById('product-form').reset();
      document.getElementById('emoji').value = '🪦';
    });

    // Edit product
    function editProduct(id) {
      const product = products.find(p => p.id == id);
      if (!product) return;
      
      editId = id;
      document.getElementById('product-id').value = id;
      document.getElementById('name').value = product.name;
      document.getElementById('category').value = product.category;
      document.getElementById('price').value = product.price;
      document.getElementById('emoji').value = product.emoji;
      
      document.getElementById('form-title').textContent = 'Редагувати пам\'ятник';
      document.getElementById('submit-btn').textContent = 'Оновити';
      document.getElementById('cancel-btn').style.display = 'inline-block';
    }

    // Cancel edit
    function cancelEdit() {
      editId = null;
      document.getElementById('product-form').reset();
      document.getElementById('emoji').value = '🪦';
      document.getElementById('form-title').textContent = 'Додати новий пам\'ятник';
      document.getElementById('submit-btn').textContent = 'Додати';
      document.getElementById('cancel-btn').style.display = 'none';
    }

    // Delete product
    function deleteProduct(id) {
      if (!confirm('Ви впевнені, що хочете видалити цей товар?')) return;
      
      products = products.filter(p => p.id != id);
      saveProducts();
      renderList();
    }

    // Export to JSON file
    function exportJSON() {
      const dataStr = JSON.stringify(products, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'products.json';
      link.click();
      URL.revokeObjectURL(url);
    }

    // Import from JSON file
    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          products = JSON.parse(e.target.result);
          saveProducts();
          renderList();
          alert('Дані успішно імпортовано!');
        } catch (err) {
          alert('Помилка при читанні файлу!');
        }
      };
      reader.readAsText(file);
    }

    // Load on start
    loadProducts();
  </script>
</body>
</html>
